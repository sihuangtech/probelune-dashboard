name: Validate dashboard
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: npm ci && npm run lint && npm run build
        working-directory: web
      - name: Verify Go and create standalone binaries
        working-directory: server
        env:
          GOWORK: 'off'
          CGO_ENABLED: '0'
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test ./...
          GOOS=linux GOARCH=amd64 go build -trimpath -o ../dist/probelune-dashboard-linux-amd64 ./cmd/server
          GOOS=linux GOARCH=arm64 go build -trimpath -o ../dist/probelune-dashboard-linux-arm64 ./cmd/server
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dashboard-build
          path: |
            dist/
            web/dist/
      - run: docker compose config --quiet && docker build -t probelune-dashboard:ci .
